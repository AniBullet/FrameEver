name: macos

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-macos
          workspaces: |
            . -> target
            apps/desktop-gpui -> target
          cache-on-failure: true

      - name: Prepare native dependencies
        run: pnpm fe setup --ci

      - name: Check the root workspace
        run: cargo check --workspace --tests

      - name: Check the GPUI app, FrameEver Converter and the CLI
        run: pnpm fe check

      - name: Test
        env:
          FRAMEEVER_VERIFY_FIXTURE_DIR: ${{ runner.temp }}/verify-fixtures
        run: pnpm fe test --all

      - name: Test the rendering crate on Metal
        run: pnpm fe test --crate frameever-rendering
