name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as a dry run. Nothing is published.
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: x86_64-pc-windows-msvc
  BUNDLE_DIR: dist

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: bash
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          version="${DRY_RUN_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semantic version like 3.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read release notes from CHANGELOG.md
        shell: bash
        run: node scripts/fe.mjs notes "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Check signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing; run scripts/setup-updater-signing.sh"
            exit 1
          fi
          if [[ -z "$FRAMEEVER_UPDATER_PUBKEY" ]]; then
            echo "::error::Variable FRAMEEVER_UPDATER_PUBKEY is missing; run scripts/setup-updater-signing.sh"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test packaging scripts
        run: node --test scripts/bundle-gpui.test.mjs scripts/prepare-gpui-dependency.test.mjs scripts/fe.test.mjs scripts/privacy.test.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release
          workspaces: |
            . -> target
            apps/desktop-gpui -> target
          cache-on-failure: true

      - name: Prepare native dependencies
        run: pnpm fe setup --ci

      - name: Increase pagefile size
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Build the installer
        env:
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm fe package --version ${{ steps.version.outputs.version }}

      - name: Check the installer and its updater signature
        shell: bash
        env:
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
        run: |
          shopt -s nullglob
          installers=("$BUNDLE_DIR"/*-setup.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "::error::Expected one NSIS installer in $BUNDLE_DIR, found ${#installers[@]}"
            exit 1
          fi
          installer="${installers[0]}"
          if [[ ! -s "$installer.sig" ]]; then
            echo "::error::No updater signature next to $installer"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const keyId = (encoded, line) =>
              Buffer.from(
                Buffer.from(encoded.trim(), "base64").toString("utf8").split(/\r?\n/)[line],
                "base64",
              ).subarray(2, 10).toString("hex");
            const signed = keyId(fs.readFileSync(process.argv[1], "utf8"), 1);
            const trusted = keyId(process.env.FRAMEEVER_UPDATER_PUBKEY, 1);
            if (signed !== trusted) {
              console.error(`Installer was signed by key ${signed}, but the app trusts ${trusted}`);
              process.exit(1);
            }
            console.log(`Updater signature key ${signed} matches the built-in public key`);
          ' "$installer.sig"

      - name: Check FrameEver Converter
        shell: bash
        run: |
          shopt -s nullglob
          converters=("$BUNDLE_DIR"/FrameEver-Converter_*_x64.exe)
          if [[ ${#converters[@]} -ne 1 ]]; then
            echo "::error::Expected one FrameEver Converter in $BUNDLE_DIR, found ${#converters[@]}"
            exit 1
          fi
          if [[ "${converters[0]}" != *"_${{ steps.version.outputs.version }}_"* ]]; then
            echo "::error::${converters[0]} is not named after version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Put the release notes next to the installer
        shell: bash
        run: cp "$RUNNER_TEMP/notes.md" "$BUNDLE_DIR/notes.md"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ env.BUNDLE_DIR }}/*-setup.exe
            ${{ env.BUNDLE_DIR }}/*-setup.exe.sig
            ${{ env.BUNDLE_DIR }}/FrameEver-Converter_*.exe
            ${{ env.BUNDLE_DIR }}/notes.md
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: bash
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          version="${DRY_RUN_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semantic version like 3.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing; run scripts/setup-updater-signing.sh"
            exit 1
          fi
          if [[ -z "$FRAMEEVER_UPDATER_PUBKEY" ]]; then
            echo "::error::Variable FRAMEEVER_UPDATER_PUBKEY is missing; run scripts/setup-updater-signing.sh"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test packaging scripts
        run: node --test scripts/bundle-gpui.test.mjs scripts/prepare-gpui-dependency.test.mjs scripts/fe.test.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release-macos
          workspaces: |
            . -> target
            apps/desktop-gpui -> target
          cache-on-failure: true

      - name: Prepare native dependencies
        run: pnpm fe setup --ci

      - name: Build the app, disk image and updater archive
        env:
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm fe package --version ${{ steps.version.outputs.version }}

      - name: Check the disk image and the updater archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="$BUNDLE_DIR/FrameEver_${VERSION}_aarch64.dmg"
          archive="$BUNDLE_DIR/FrameEver_${VERSION}_aarch64.app.tar.gz"
          for file in "$dmg" "$archive" "$archive.sig"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::$file is missing or empty"
              exit 1
            fi
          done
          hdiutil verify "$dmg"
          work="$RUNNER_TEMP/package-check"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          app="$work/FrameEver.app"
          plist="$app/Contents/Info.plist"
          bundled="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::The app says version $bundled, not $VERSION"
            exit 1
          fi
          for binary in FrameEver frameever-muxer frameever-cli; do
            if [[ ! -x "$app/Contents/MacOS/$binary" ]]; then
              echo "::error::$binary is missing from the app"
              exit 1
            fi
          done
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/frameever-cli" --version

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            ${{ env.BUNDLE_DIR }}/*.dmg
            ${{ env.BUNDLE_DIR }}/*.app.tar.gz
            ${{ env.BUNDLE_DIR }}/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    needs: [build, build-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download macOS package
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist

      - name: Write update manifest
        env:
          FRAMEEVER_UPDATER_PUBKEY: ${{ vars.FRAMEEVER_UPDATER_PUBKEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/fe.mjs manifest --version "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Keep the update manifest of a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            "${prerelease[@]}" \
            dist/*-setup.exe dist/*-setup.exe.sig dist/FrameEver-Converter_*.exe \
            $(ls dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig 2>/dev/null) dist/latest.json
