<!doctype html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Main window and library · FrameEver design reference</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="main-window-library.css">
</head>
<body>
<div id="shell"></div>
<main>
	<section id="live"><h2 id="t-live"></h2><p class="lead" id="l-live"></p><div class="stage" id="live-stage"></div></section>
	<section id="states"><h2 id="t-states"></h2><p class="lead" id="l-states"></p><div id="state-tabs" style="margin-bottom:12px"></div><div class="stage" id="states-stage"></div></section>
	<section id="transition"><h2 id="t-transition"></h2><p class="lead" id="l-transition"></p><div id="transition-steps" class="steps"></div><div style="display:flex;gap:8px;align-items:center;margin:12px 0" id="transition-controls"></div><div class="stage" id="transition-stage"></div></section>
	<section id="palette"><h2 id="t-palette"></h2><p class="lead" id="l-palette"></p><div class="pair" id="palette-pair"></div><div id="palette-tabs" style="margin:16px 0 12px"></div><div class="stage" id="palette-stage"></div></section>
	<section id="delete"><h2 id="t-delete"></h2><p class="lead" id="l-delete"></p><div class="grid-3" id="delete-grid"></div></section>
	<section id="keys"><h2 id="t-keys"></h2><p class="lead" id="l-keys"></p><div class="grid-2" id="keys-grid"></div></section>
</main>
<script src="../tokens.js"></script>
<script src="../icons.js"></script>
<script src="../design.js"></script>
<script src="main-window-library.js"></script>
</body>
</html>
