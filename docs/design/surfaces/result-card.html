<html lang="zh-CN" data-theme="dark" data-lang="zh">

<div id="shell"></div>
<main>
	<section id="card"><h2 id="t-card"></h2><p class="lead" id="l-card"></p><div class="tools" id="tools"></div><div class="stage" id="stage"></div></section>

	<section id="references"><h2 id="t-ref"></h2><p class="lead" id="l-ref"></p><div class="inv-wrap" id="ref-table"></div></section>
