<!doctype html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area picker and countdown · FrameEver design reference</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="recording-controls.css">
<link rel="stylesheet" href="area-picker.css">
</head>
<body>
<div id="shell"></div>
<main>
	<section id="live"><h2 id="t-live"></h2><p class="lead" id="l-live"></p><div class="live-tools" id="live-tools"></div><div class="stage" id="stage"><div class="desk" id="desk" tabindex="0"><div id="wall"></div><div id="ov"></div></div></div><p class="state-line tnum" id="state-line"></p></section>
	<section id="states"><h2 id="t-states"></h2><p class="lead" id="l-states"></p><div class="mini-grid" id="mini-grid"></div></section>
	<section id="shared"><h2 id="t-shared"></h2><p class="lead" id="l-shared"></p><div class="inv-wrap" id="rules"></div></section>
	<section id="keyboard"><h2 id="t-keys"></h2><p class="lead" id="l-keys"></p><div class="inv-wrap" id="keys"></div></section>
	<section id="inventory"><h2 id="t-inv"></h2><p class="lead" id="l-inv"></p><div class="inv-wrap" id="inv"></div></section>
	<section id="additions"><h2 id="t-add"></h2><p class="lead" id="l-add"></p><div class="inv-wrap" id="add"></div></section>
	<section id="references"><h2 id="t-ref"></h2><p class="lead" id="l-ref"></p><div class="inv-wrap" id="refs"></div></section>
</main>
<script src="../tokens.js"></script>
<script src="../icons.js"></script>
<script src="../design.js"></script>
<script src="area-picker.js"></script>
</body>
</html>
