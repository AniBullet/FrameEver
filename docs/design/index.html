<!doctype html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameEver design reference</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="design.css">
<style>
.ramp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
.ramp div{padding:8px 6px 6px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;line-height:1.3}
.ramp b{font-size:12px;font-weight:600}
.ramp-roles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:10.5px;color:var(--muted-foreground);margin:4px 0 14px;text-align:center}
.ramp-roles .two{grid-column:span 2}
.ramp-roles .three{grid-column:span 3}
.ramp-box{padding:14px;border-radius:var(--radius-lg);border:1px solid var(--border)}
.ramp-box h4{margin:0 0 8px;font-size:13px;font-weight:600}
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.states div{border-radius:var(--radius-sm);padding:8px;font-size:11px}
.states p{display:flex;gap:4px;margin:6px 0 0}
.states p i{flex:1;height:18px;border-radius:4px}
.layer b{display:block;font-size:var(--text-title);margin-bottom:4px}
.layer span.body{color:var(--muted-foreground);font-size:var(--text-small)}
.layer em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--link)}
.swatch{display:inline-flex;align-items:center;gap:6px}
.swatch i{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid var(--border);flex:none}
.type-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:16px;align-items:baseline;padding:10px 0;border-top:1px solid var(--border)}
.type-row:first-child{border-top:0}
.type-row small{display:block;font-size:11px;color:var(--muted-foreground)}
@media (max-width:980px){.type-row{grid-template-columns:1fr}}
.space-row{display:flex;align-items:center;gap:12px;padding:3px 0;font-size:var(--text-small)}
.space-row i{display:block;height:12px;background:var(--klein-tint-bar);border-radius:2px}
.space-row code{width:70px;color:var(--muted-foreground)}
.radii{display:flex;flex-wrap:wrap;gap:14px}
.radii div{width:96px;text-align:center;font-size:11px;color:var(--muted-foreground)}
.radii i{display:block;width:96px;height:64px;background:var(--secondary);border:1px solid var(--border-strong);margin-bottom:6px}
.nest{background:var(--popover);border:1px solid var(--border);padding:4px;border-radius:16px;display:inline-block}
.nest div{background:var(--secondary);border:1px dashed var(--border-strong);border-radius:12px;width:240px;height:96px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted-foreground)}
.levels{position:relative;background:var(--background);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;min-height:230px}
.levels small{display:block;font-size:11px;color:var(--muted-foreground);margin-bottom:6px}
.levels .one{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;width:62%;height:130px}
.levels .menu{position:absolute;right:16px;top:70px;width:46%;min-width:0}
.focus-row{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:18px;background:var(--background);border:1px solid var(--border);border-radius:var(--radius-lg)}
.ring{outline:2px solid var(--ring)!important;outline-offset:2px}
.rules{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;margin:0;padding:0;list-style:none}
.rules li{display:contents}
.rules i{font-style:normal;font-weight:600;font-size:12px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rules.yes i{background:var(--primary);color:var(--primary-foreground)}
.rules.no i{background:var(--secondary);color:var(--muted-foreground);border:1px solid var(--border)}
.rules div{padding:2px 0 10px}
.rules b{display:block;font-weight:500}
.rules span.body{font-size:var(--text-small);color:var(--muted-foreground)}
.track{position:relative;height:40px;border-radius:var(--radius-md);background:var(--secondary);border:1px solid var(--border);margin:6px 0 12px;overflow:hidden}
.track i{position:absolute;left:4px;top:4px;width:56px;height:30px;border-radius:calc(var(--radius-md) - 4px);background:var(--primary);transition:left var(--duration-move) var(--ease-move)}
.track.go i{left:calc(100% - 60px)}
.fade-box,.colour-box{height:40px;border-radius:var(--radius-md);display:flex;align-items:center;padding:0 12px;font-size:12px;margin:6px 0 12px}
.fade-box{background:var(--popover);border:1px solid var(--border-strong);transition:opacity var(--duration-exit) var(--ease-exit)}
.fade-box.out{opacity:0}
.colour-box{background:var(--secondary);border:1px solid var(--border);transition:background var(--duration-fast) var(--ease-effects)}
.colour-box.on{background:var(--secondary-hover)}
.never{columns:2;column-gap:24px;margin:0;padding-left:18px;color:var(--muted-foreground)}
.never li{margin-bottom:6px;break-inside:avoid}
.never b{color:var(--foreground);font-weight:500}
@media (max-width:980px){.never{columns:1}}
.welcome{border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden}
.welcome header{padding:8px 12px;font-size:11px;font-weight:500;background:var(--card);color:var(--muted-foreground);border-bottom:1px solid var(--border)}
.welcome .body{padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;min-height:430px}
.welcome .paper{margin-top:14px;width:100%;max-width:330px;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.welcome svg{overflow:visible;display:block}
.comp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.comp-col{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="shell"></div>
<main>
	<section id="layers">
		<h2 id="t-layers"></h2>
		<p class="lead" id="l-layers"></p>
		<div class="grid-3" id="layer-cards"></div>
	</section>
	<section id="ramps"><h2 id="t-ramps"></h2><p class="lead" id="l-ramps"></p><div class="grid-2" id="ramp-grid"></div></section>
	<section id="semantic"><h2 id="t-semantic"></h2><p class="lead" id="l-semantic"></p><div class="card scroll"><table id="semantic-table"></table></div></section>
	<section id="component-tokens"><h2 id="t-component"></h2><p class="lead" id="l-component"></p><div class="card scroll"><table id="component-table"></table></div></section>
	<section id="contrast"><h2 id="t-contrast"></h2><p class="lead" id="l-contrast"></p><div class="card scroll"><table id="contrast-table"></table></div></section>
	<section id="type"><h2 id="t-type"></h2><p class="lead" id="l-type"></p><div class="card" id="type-scale"></div></section>
	<section id="space"><h2 id="t-space"></h2><p class="lead" id="l-space"></p>
		<div class="grid-3">
			<div class="card" id="space-card"></div>
			<div class="card" id="radius-card"></div>
			<div class="card" id="nest-card"></div>
		</div>
	</section>
	<section id="elevation"><h2 id="t-elevation"></h2><p class="lead" id="l-elevation"></p><div class="grid-2" id="elevation-grid"></div></section>
	<section id="focus"><h2 id="t-focus"></h2><p class="lead" id="l-focus"></p><div class="focus-row" id="focus-row"></div><div class="card scroll" style="margin-top:12px"><table id="focus-table"></table></div></section>
	<section id="klein"><h2 id="t-klein"></h2><p class="lead" id="l-klein"></p><div class="grid-2" id="klein-grid"></div></section>
	<section id="motion"><h2 id="t-motion"></h2><p class="lead" id="l-motion"></p><div class="card scroll"><table id="motion-table"></table></div>
		<div class="grid-2" style="margin-top:16px" id="motion-grid"></div>
		<div class="card" style="margin-top:16px" id="never-card"></div>
	</section>
	<section id="welcome"><h2 id="t-welcome"></h2><p class="lead" id="l-welcome"></p>
		<div style="margin-bottom:12px"><button class="btn primary" id="replay"></button></div>
		<div class="grid-2" id="welcome-grid"></div>
		<div class="grid-2" style="margin-top:16px" id="welcome-tables"></div>
	</section>
	<section id="components"><h2 id="t-components"></h2><p class="lead" id="l-components"></p><div class="grid-2" id="component-grid"></div></section>
</main>
<script src="tokens.js"></script>
<script src="icons.js"></script>
<script src="design.js"></script>
<script>
const { tokens, L, icon, shell, hex, oklch, color, value, contrast, spring, onChange } = FE;
const $ = (id) => document.getElementById(id);
const fill = (id, html) => {
	$(id).innerHTML = html;
};
const titles = {
	layers: ["Three token layers", "三层 token", "Every value is OKLCH and flows through three layers: the brand layer holds only ramps, the semantic layer only points at ramps, the component layer only points at semantic names. Dark is the base; light gets its own ramps (the Radix way) rather than a flipped dark. This whole page is drawn with these tokens.", "每个值都是 OKLCH，按三层流动：品牌层只放色阶，语义层只引用色阶，组件层只引用语义层。深色是基准，浅色单独生成色阶（Radix 的做法），不是把深色反过来。整页都用这些 token 画出来。"],
	ramps: ["Brand layer: 12-step ramps", "品牌层：12 阶色阶", "Radix roles: 1–2 backgrounds, 3–5 component fills (rest, hover, pressed), 6–8 borders, 9–10 solids (9 is the brand colour), 11–12 text. High-lightness light blues are pulled into the sRGB gamut. Both themes always show here, whatever the toggle says.", "按 Radix 的角色划分：1–2 背景，3–5 组件底色（常态、悬停、按下），6–8 边框，9–10 实色（9 就是品牌色本身），11–12 文字。浅色高亮度端的蓝色压进了 sRGB 色域。两套色阶同时显示，不随顶部切换变化。"],
	semantic: ["Semantic layer", "语义层", "shadcn/ui names, as GPUI Kit's ThemeColor uses them. In shadcn accent is the hover fill, not the brand colour: the brand colour is primary and blue text is link.", "名字来自 shadcn/ui，和 GPUI Kit 的 ThemeColor 一致。注意 shadcn 的 accent 是悬停底色，不是品牌色；品牌色叫 primary，蓝色文字叫 link。"],
	component: ["Component layer", "组件层", "GPUI Kit's component fields plus FrameEver's editor tokens. Field names follow GPUI Kit's theme_color.rs at implementation time; this table settles which semantic token each one takes.", "GPUI Kit 自带的组件字段加上编辑器专用的字段。具体字段名在实现时以 GPUI Kit 的 theme_color.rs 为准，这里定的是取哪个语义 token。"],
	contrast: ["Contrast (WCAG 2)", "对比度（WCAG 2）", "Text needs at least 4.5:1 (AA). Control edges, focus rings and the switch track need 3:1 (1.4.11). Dividers between regions are decorative. Ratios are computed live from the tokens.", "文字要 ≥ 4.5:1（AA）；控件边界、焦点环、开关轨道要 ≥ 3:1（1.4.11）；区域之间的分隔线是装饰，不要求对比度。数值由 token 实时算出。"],
	type: ["Type", "字体与字号", "Inter for Latin and numbers, HarmonyOS Sans SC for Chinese. Body is 13.5 px. Timecodes, timers and file sizes use tabular numbers. Weights: 400, 500, 600.", "英文和数字用 Inter，中文用 HarmonyOS Sans SC。正文 13.5 px。时间码、计时、文件大小一律用等宽数字。只用 400、500、600 三个字重。"],
	space: ["Space and radius", "间距和圆角", "2 px is the smallest unit and 4 px the main grid. Radii are concentric: inner radius = outer radius − padding, 4 px at least. One density only: 34 px rows, 32 px controls.", "2 px 是最小单位，4 px 是主网格。圆角是同心的：里层圆角 = 外层圆角 − 内边距，最小 4 px。只有一种密度：34 px 行高，32 px 控件。"],
	elevation: ["Borders and levels", "边框与层级", "No shadow, no glass, no blur. Levels come from two things only: a higher level is lighter (dark theme) or whiter (light theme), and it has a border. The scrim is solid at 60%.", "没有阴影，没有毛玻璃，没有模糊。层级只靠两样东西：越高的层越亮（深色）或越白（浅色），以及边框。遮罩是不透明度 60% 的纯色。"],
	focus: ["Focus ring", "焦点环", "From Fluent 2: only on keyboard focus, 2 px solid, with a 2 px gap so it stays visible on blue buttons. Radius = control radius + 2 px. The first row is always on; Tab through the second.", "参照 Fluent 2：只在键盘聚焦时出现，2 px 实线，留 2 px 缝，蓝色按钮上也看得清。圆角 = 控件圆角 + 2 px。第一行常亮，按 Tab 在第二行移动试试。"],
	klein: ["Where Klein blue may appear", "Klein 蓝只能出现在这些地方", "The less blue, the more it means. This is the whole list; anything not on it stays neutral.", "蓝色越少越贵。下面是完整的白名单，没列出的地方一律用中性灰。"],
	motion: ["Motion", "动效", "Only what GPUI can do: opacity, colour, position, size (scale and rotate for SVG icons only). Colour and opacity never overshoot. With reduced motion on, everything jumps to its end state, except fades on the main window.", "只在 GPUI 能做的范围内：透明度、颜色、位置、尺寸（缩放和旋转只给 SVG 图标）。颜色和透明度从不回弹。减少动态效果打开时全部直接到终点，主窗口展开保留淡入淡出。"],
	welcome: ["Welcome and onboarding ink", "欢迎页和引导的手绘", "Welcome and onboarding keep their style, doodles and animation; they are the model for hand-drawn touches elsewhere. Only the ink moves onto Klein Field tokens. Paths, widths and timing come from onboarding_doodles.rs and doodle.rs. Gradients and translucent cards become solid.", "欢迎页和引导保持风格、涂鸦和动画，也是别处手绘点缀的样板，只把墨水换成 Klein Field token。路径、线宽、时间照搬 onboarding_doodles.rs 和 doodle.rs。渐变和半透明卡片换成纯色。"],
	components: ["Components", "组件", "Built on GPUI Kit (#47): structure from shadcn/ui, Windows interaction and motion from Fluent 2. The names below are GPUI Kit's. Surface pages reuse these styles.", "基于 GPUI Kit（#47）：结构来自 shadcn/ui，Windows 上的交互和动效来自 Fluent 2。下面用的是 GPUI Kit 的名字。各界面页复用这里的样式。"],
};
for (const [key, [en, zh, leadEn, leadZh]] of Object.entries(titles)) {
	fill(`t-${key}`, L(en, zh));
	fill(`l-${key}`, L(leadEn, leadZh));
}
shell({ here: "index", depth: 0, sections: [
	["layers", "Layers", "三层"], ["ramps", "Ramps", "色阶"], ["semantic", "Semantic", "语义层"], ["component-tokens", "Component tokens", "组件层"], ["contrast", "Contrast", "对比度"], ["type", "Type", "字体"], ["space", "Space", "间距"], ["elevation", "Levels", "层级"], ["focus", "Focus", "焦点环"], ["klein", "Klein blue", "蓝色白名单"], ["motion", "Motion", "动效"], ["welcome", "Hand-drawn", "手绘"], ["components", "Components", "组件"],
] });

fill("layer-cards", [
	["1 · Brand", "Brand layer", "品牌层", "Klein and near-achromatic neutral 12-step ramps plus red, amber and green. They appear only as constants in theme.rs; interface code never uses them directly.", "Klein 和近乎无彩的中性灰 12 阶色阶，以及红、琥珀、绿。只出现在 theme.rs 常量里，界面代码不直接用。"],
	["2 · Semantic", "Semantic layer", "语义层", "shadcn/ui names matching GPUI Kit's ThemeColor, plus a few of FrameEver's own: link, recording, preview.", "shadcn/ui 的名字，和 GPUI Kit 的 ThemeColor 一致；加几个 FrameEver 自己的：link、recording、preview。"],
	["3 · Component", "Component layer", "组件层", "GPUI Kit's fields and FrameEver's EditorTokens. Each field takes exactly one semantic token.", "GPUI Kit 的组件字段和 FrameEver 的 EditorTokens。每个字段只取一个语义 token。"],
].map(([n, en, zh, de, dz]) => `<div class="card layer"><em>${n}</em><b>${L(en, zh)}</b><span class="body">${L(de, dz)}</span></div>`).join(""));

const fmt = (v) => `${v[0]} ${v[1]} ${v[2]}`;
const ramp = (theme, family, en, zh) => {
	const steps = tokens.brand[theme][family];
	const n = (i) => oklch(tokens.brand[theme].neutral[i]);
	const statusNames = { red: ["Red: recording, delete, error", "红：录制、删除、错误"], amber: ["Amber: warning", "琥珀：警告"], green: ["Green: success", "绿：成功"] };
	const states = family === "neutral" ? `<div class="states">${["red", "amber", "green"].map((f) => {
		const s = tokens.brand[theme][f];
		return `<div style="background:${oklch(s.tint)};color:${oklch(s.text)}"><b>${L(...statusNames[f])}</b><p>${["tint", "solid", "hover", "text"].map((k) => `<i title="${k}" style="background:${oklch(s[k])};border:1px solid ${n(6)}"></i>`).join("")}</p></div>`;
	}).join("")}</div>` : "";
	return `<div class="ramp-box" style="background:${n(1)};color:${n(11)};border-color:${n(6)}"><h4>${L(en, zh)}</h4>
		<div class="ramp" style="border-color:${n(6)}">${steps.map((s, i) => {
			const light = s[0] > 0.7;
			return `<div style="background:${oklch(s)};color:${light ? "oklch(0.18 0.02 266)" : "oklch(0.97 0.005 266)"}" title="${fmt(s)}"><b>${i + 1}</b><span>${s[0]}<br>${hex(s)}</span></div>`;
		}).join("")}</div>
		<div class="ramp-roles"><span class="two">${L("Backgrounds", "背景")}</span><span class="three">${L("Components", "组件")}</span><span class="three">${L("Borders", "边框")}</span><span class="two">${L("Solids", "实色")}</span><span class="two">${L("Text", "文字")}</span></div>${states}</div>`;
};
fill("ramp-grid", ramp("dark", "neutral", "Dark · neutral", "深色 · neutral") + ramp("light", "neutral", "Light · neutral", "浅色 · neutral") + ramp("dark", "klein", "Dark · klein (9 = #1F3FD8)", "深色 · klein（9 = #1F3FD8）") + ramp("light", "klein", "Light · klein (9 = #1F3FD8)", "浅色 · klein（9 = #1F3FD8）"));

const refCell = (theme, ref) => {
	const v = value(theme, ref);
	const label = ref.replace(".", "-").replace("fixed-", "");
	return `<td><span class="swatch"><i style="background:${oklch(v)}"></i><span><b style="font-weight:500">${label}</b><br><code>${fmt(v)}${v[3] ? ` / ${v[3]}` : ""}</code> <code>${hex(v)}</code></span></span></td>`;
};
fill("semantic-table", `<tr><th>${L("Token", "语义 token")}</th><th>${L("Dark", "深色")}</th><th>${L("Light", "浅色")}</th><th>${L("Used for", "用在哪")}</th></tr>${tokens.semantic.map((s) => `<tr><td><code>${s.name}</code></td>${refCell("dark", s.dark)}${refCell("light", s.light)}<td class="dim">${s.en ? L(s.en, s.zh) : ""}</td></tr>`).join("")}`);
fill("component-table", `<tr><th>${L("Group", "组")}</th><th>${L("Component field", "组件字段")}</th><th>${L("Semantic token", "取自语义 token")}</th></tr>${tokens.component.map((c) => `<tr><td class="dim">${c.group}</td><td><code>${c.field}</code></td><td><code>${c.from}</code></td></tr>`).join("")}`);

const pairs = [
	["foreground", "background", "text", "Body", "正文"], ["foreground", "card", "text", "Text in a group", "分组里的文字"], ["foreground", "popover", "text", "Menu text", "菜单文字"], ["foreground", "secondary", "text", "Normal button", "普通按钮"], ["foreground", "accent", "text", "Text on a hovered row", "悬停行上的文字"], ["selection_foreground", "selection", "text", "Selected row, selected nav", "选中行、选中导航"],
	["muted_foreground", "background", "text", "Secondary text", "次要文字"], ["muted_foreground", "card", "text", "Description in a group", "分组里的说明"], ["muted_foreground", "popover", "text", "Shortcut in a menu", "菜单里的快捷键"], ["muted_foreground", "accent", "text", "Metadata on a hovered row", "悬停行上的元信息"], ["muted_foreground", "selection", "text", "Metadata on a selected tile", "选中图块的元信息"],
	["primary_foreground", "primary", "text", "Primary button", "主按钮"], ["primary_foreground", "primary_hover", "text", "Primary hover", "主按钮悬停"], ["primary_foreground", "primary_active", "text", "Primary pressed", "主按钮按下"],
	["link", "background", "text", "Link", "链接"], ["link", "card", "text", "Link in a group", "分组里的链接"], ["link", "selection", "text", "Blue text on a selected item", "选中项里的蓝字"],

	return `<div class="welcome"><header>Klein Field · ${theme === "dark" ? L("Dark", "深色") : L("Light", "浅色")}</header><div class="body" style="background:${pal.bg};color:${pal.ink}">
		<div data-rise="0.35">${doodleSvg("SCREEN", 240, 208, 350, pal, `${theme}-s`)}</div>
		<div data-rise="0.9" style="display:flex;flex-direction:column;align-items:center;margin-top:6px"><div style="font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.01em">${L("Welcome to FrameEver", "欢迎使用 FrameEver")}</div><div style="margin-top:4px">${doodleSvg("UNDERLINE", 150, 14, 1300, pal, `${theme}-u`)}</div></div>
		<div data-rise="1.15" style="font-size:15px;line-height:22px;color:${pal.soft};margin-top:10px;text-align:center;max-width:340px">${L("Record, edit and export, all on your own computer.", "录屏、剪辑、导出，全部留在你自己的电脑上。")}</div>
		<div data-rise="1.45" class="paper" style="background:${pal.card};border:1.5px solid ${pal.track}">${doodleSvg("ALL_SET", 44, 38, 1700, pal, `${theme}-a`)}<div><b style="font-weight:500">${L("Permissions are ready", "权限都准备好了")}</b><div style="color:${pal.soft};font-size:12px">${L("Screen recording · Microphone · Camera", "屏幕录制 · 麦克风 · 摄像头")}</div></div></div>
	</div></div>`;
};
fill("welcome-grid", welcomePanel("dark") + welcomePanel("light"));
fill("welcome-tables", `<div class="card scroll"><h3>${L("Ink to token", "墨水换成哪个 token")}</h3><table><tr><th>${L("Ink", "墨水")}</th><th>${L("Dark", "深色")}</th><th>${L("Light", "浅色")}</th><th>${L("Draws", "画什么")}</th></tr>${inks.map(([ink, dark, light, en, zh]) => `<tr><td><code>${ink}</code></td><td><span class="swatch"><i style="background:${color("dark", dark)}"></i><code>${dark}</code></span></td><td><span class="swatch"><i style="background:${color("light", light)}"></i><code>${light}</code></span></td><td class="dim">${L(en, zh)}</td></tr>`).join("")}</table></div>
<div class="card scroll"><h3>${L("Hand-drawn motion (unchanged)", "手绘的动效（保留原样）")}</h3><table><tr><th>${L("Action", "动作")}</th><th>${L("Time", "时间")}</th><th>${L("Curve", "曲线")}</th></tr>${[
	["Draw", "描线", "300–850 ms", "ease-out cubic"], ["Fade", "淡入", "300–400 ms", "ease-out cubic"], ["Pop", "弹出", "450 ms", "0.2 → 1.2 → 1"], ["Boil", "抖动", "150 ms × 4", "1.25 / 20"], ["March", "虚线行进", "1.1 s", "linear"], ["Bob", "浮动", "1.9 s", "cosine"], ["Pulse", "呼吸", "1.2 s", "cosine"], ["Step change", "引导换步", "500 ms", "smoothstep"],
].map(([a, b, c, f]) => `<tr><td>${L(a, b)}</td><td class="mono">${c}</td><td><code>${f}</code></td></tr>`).join("")}</table><p class="note">${L("Longer than product motion, so it is kept to brand moments. Only welcome and onboarding keep boiling. With reduced motion, doodles are drawn complete and still.", "比产品界面的动效长，只用在品牌时刻。只有欢迎页和引导继续抖动。减少动态效果时直接画好，不抖动。")}</p></div>
<div class="card scroll"><h3>${L("Hand-drawn outside welcome and onboarding", "欢迎页和引导以外的手绘")}</h3><table><tr><th>${L("Place", "位置")}</th><th>${L("Doodle", "涂鸦")}</th></tr>${[
	["The library with nothing in it", "资源库什么都没有", "FRAME"], ["Other empty lists outside the editor, such as Automations", "编辑器之外的其他空列表，如自动化", "FLOW"], ["First finished recording, with one line of text", "第一次录制完成，带一句话", "TICK"], ["Every finished recording, on the new card", "每次录制完成，画在新卡片上", "TICK"], ["First-run hint to the library, once", "第一次用时指向资源库，只出现一次", "UP_ARROW"], ["Export finished", "导出完成", "ALL_SET"], ["No matching items", "没有匹配的条目", "LENS"], ["Settings, About", "设置的关于页", "UNDERLINE"], ["The editor's No clips yet: drawn complete, no entrance", "编辑器的“还没有片段”：直接画好，没有入场", "TICK"],
].map(([a, b, c]) => `<tr><td>${L(a, b)}</td><td><code>${c}</code></td></tr>`).join("")}</table><p class="note">${L("These draw once and hold still: no boil, march, bob or pulse. One per window at a time, 120 px wide at most. Ink as in the table above: red only for the record dot, green only for a tick. Never while recording, on errors, warnings or delete dialogs, on controls, inside data, or in a handwriting font. The doodles are in the prototype on the branch prototype/hand-drawn-touches.", "这些位置只画一次，然后静止：不抖动、不行进、不浮动、不呼吸。一个窗口同时只有一处，最宽 120 px。墨水按上表：红只给录制点，绿只给勾。录制中、错误、警告、删除对话框、控件、数据里都不用，也不用手写字体。涂鸦在 prototype/hand-drawn-touches 分支的原型里。")}</p></div>`);
let welcomeAt = performance.now();
$("replay").innerHTML = `${icon("rotate-ccw")}${L("Replay", "重播入场")}`;
$("replay").onclick = () => {
	welcomeAt = performance.now();
};
const easeOut = (t) => 1 - (1 - Math.min(1, Math.max(0, t))) ** 3;
const smooth = (t) => {
	const v = Math.min(1, Math.max(0, t));
	return v * v * (3 - 2 * v);
};
const beat = (at, delay, dur) => Math.min(1, Math.max(0, (at - delay) / dur));
const tick = (now) => {
	const ms = now - welcomeAt;
	const seed = String(1 + (Math.floor(now / 150) % 4));
	for (const f of document.querySelectorAll("#welcome-grid feTurbulence")) f.setAttribute("seed", seed);
	for (const el of document.querySelectorAll("#welcome-grid [data-rise]")) {
		const delay = Number(el.dataset.rise);
		el.style.transform = `translateY(${12 * (1 - easeOut(beat(ms / 1000, delay, 1.1)))}px)`;
		el.style.opacity = smooth(beat(ms / 1000, delay, 1));
	}
	for (const svg of document.querySelectorAll("#welcome-grid svg[data-doodle]")) {
		const D = doodles[svg.dataset.doodle];
		const at = ms - Number(svg.dataset.start);
		const sec = Math.max(0, at) / 1000;
		for (const p of svg.querySelectorAll("path[data-i]")) {
			const s = D.strokes[Number(p.dataset.i)];
			const [kind, delay, dur] = s.m;
			const t = beat(at, delay, dur);
			let alpha = 1;
			let grow = 1;
			if (kind === "fade") alpha = easeOut(t);
			if (kind === "pop") {
				alpha = easeOut(t);
				grow = t < 0.6 ? 0.2 + t / 0.6 : 1.2 - 0.2 * ((t - 0.6) / 0.4);
			}
			if (t <= 0) alpha = 0;
			if (s.pulse) alpha *= 0.65 + 0.35 * Math.cos(Math.PI * 2 * ((sec / 1.2) % 1));
			const bob = s.bob ? -4 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * ((sec / 1.9) % 1))) : 0;
			p.style.opacity = alpha;
			p.style.transform = `translate(0px, ${bob}px) scale(${grow})`;
			if (kind === "draw") p.setAttribute("stroke-dashoffset", String(1 - easeOut(t)));
			if (s.march) p.setAttribute("stroke-dashoffset", String(-((sec / 1.1) % 1) * 6.2));
		}
	}
	requestAnimationFrame(tick);
};
requestAnimationFrame(tick);

const card = (name, body) => `<div class="card"><h3><code style="font-size:13px">${name}</code></h3>${body}</div>`;
fill("component-grid", [
	card("Button", `<div class="comp"><button class="btn primary">${L("Start recording", "开始录制")}</button><button class="btn">${L("Export…", "导出…")}</button><button class="btn ghost">${L("Cancel", "取消")}</button><button class="btn danger">${L("Delete", "删除")}</button><button class="btn icon" title="Settings">${icon("settings")}</button><button class="btn" disabled>${L("Compress", "压缩")}</button></div>`),
	card("Input · Select · Kbd", `<div class="comp"><label class="input" style="width:220px">${icon("search")}<input data-ph-en="Search" data-ph-zh="搜索"><span class="kbd">Ctrl F</span></label><span class="select">${L("Date", "日期")}${icon("chevron-down", "sm")}</span><span class="kbd">Ctrl K</span></div>`),
	card("Switch · Checkbox · Radio", `<div class="comp"><button class="switch on" onclick="this.classList.toggle('on')"></button><button class="switch" onclick="this.classList.toggle('on')"></button><button class="check on" onclick="this.classList.toggle('on')">${icon("check", "sm")}</button><button class="check" onclick="this.classList.toggle('on')">${icon("check", "sm")}</button></div><div style="margin-top:12px;max-width:320px"><div class="radio on"><i></i><div>${L("Delete the whole project", "删除整个项目")}<small>${L("Moves to the Recycle Bin", "移到回收站")}</small></div></div></div>`),
	card("TabBar (segmented)", `<div class="comp"><div class="seg"><button class="on">${L("All", "全部")} <em>12</em></button><button>${L("Studio", "工作室")} <em>5</em></button><button>${L("Instant", "即时")} <em>4</em></button><button>${L("Screenshots", "截图")} <em>3</em></button></div></div>`),
	card("Slider · Progress", `<div class="comp-col"><div class="slider"><i></i><b style="width:58%"></b><u style="left:58%"></u></div><div class="progress"><i style="width:42%"></i></div><div class="note" style="margin:0">${L("Exporting… 42%", "正在导出… 42%")}</div></div>`),
	card("Tag · Badge", `<div class="comp"><span class="tag on">${L("Exported", "已导出")}${icon("x", "sm")}</span><span class="tag">${L("Not exported", "未导出")}</span><span class="badge">12</span><span class="badge klein">3</span></div>`),
	card("List", `<div><div class="list-row on">${icon("monitor")}<span class="grow">${L("Display", "显示器")}</span><em>2560 × 1440</em></div><div class="list-row">${icon("video")}<span class="grow">${L("Camera", "摄像头")}</span><em>${L("No camera", "无摄像头")}</em>${icon("chevron-down", "sm")}</div><div class="list-row">${icon("mic")}<span class="grow">${L("Microphone", "麦克风")}</span><em>${L("Default", "默认")}</em>${icon("chevron-down", "sm")}</div></div>`),
	card("PopupMenu · Tooltip", `<div class="comp" style="align-items:flex-start"><div class="menu" style="width:240px"><button>${icon("play")}<span class="grow">${L("Open", "打开")}</span><span class="kbd">Enter</span></button><button>${icon("download")}<span class="grow">${L("Export…", "导出…")}</span></button><hr><button class="danger">${icon("trash")}<span class="grow">${L("Delete…", "删除…")}</span><span class="kbd">Del</span></button></div><span class="tooltip">${L("Split", "分割")}<span class="kbd">S</span></span></div>`),
	card("Dialog", `<div class="dialog" style="width:100%"><h3>${L("Delete the original video?", "删除原始视频？")}</h3><p>${L("The compressed copy stays. This can't be undone.", "压缩副本会保留。这个操作无法撤销。")}</p><div class="actions"><button class="btn">${L("Cancel", "取消")}</button><button class="btn danger">${L("Delete original", "删除原始视频")}</button></div></div>`),
	card("Notification", `<div class="toast"><span class="grow">${L("Deleted “Bug repro”", "已删除“Bug repro”")}</span><button class="btn ghost">${L("Undo", "撤销")}</button></div>`),
].join(""));
</script>
