[package]
name = "frameever-installer-app"
version = "1.0.0-dev"
description = "Installs, updates and uninstalls FrameEver."
edition = "2024"
license = "AGPL-3.0"
publish = false

[lib]
test = false

[[bin]]
name = "frameever-setup"
path = "src/main.rs"

[dependencies]
frameever-utils = { path = "../../../crates/utils" }
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "runtime_shaders",
] }
raw-window-handle = "0.6"
semver = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
tauri-winres = "0.3.7"

[dev-dependencies]
tempfile = "3"
