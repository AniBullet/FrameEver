[package]
name = "frameever-converter-app"
version = "1.0.0-dev"
description = "Brings Cap and Cap-aniBullet 2.x recordings into FrameEver."
edition = "2024"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "frameever-converter"
path = "src/main.rs"

[dependencies]
frameever-converter = { path = "../../../crates/converter" }
frameever-utils = { path = "../../../crates/utils" }
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "runtime_shaders",
] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[build-dependencies]
tauri-winres = "0.3.7"

[dev-dependencies]
frameever-project = { path = "../../../crates/project" }
tempfile = "3"
