[package]
name = "cap-recording"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
test-utils = []
memory-profiling = ["dep:dhat"]

[dependencies]
cap-audio = { path = "../audio" }
cap-fail = { path = "../fail" }
cap-project = { path = "../project" }
cap-media = { path = "../media" }
cap-rendering = { path = "../rendering" }
cap-flags = { path = "../flags" }
cap-utils = { path = "../utils" }
scap-targets = { path = "../scap-targets" }
cap-cursor-capture = { path = "../cursor-capture" }
cap-media-info = { path = "../media-info" }
cap-cursor-info = { path = "../cursor-info" }
cap-camera = { path = "../camera", features = ["serde", "specta"] }
cap-camera-ffmpeg = { path = "../camera-ffmpeg" }
cap-enc-ffmpeg = { path = "../enc-ffmpeg" }
cap-frame-converter = { path = "../frame-converter" }
cap-timestamp = { path = "../timestamp" }
cap-muxer-protocol = { path = "../cap-muxer-protocol" }
scap-ffmpeg = { path = "../scap-ffmpeg" }

specta = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }
thiserror = { workspace = true }
ffmpeg = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }

serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
chrono = "0.4.38"
uuid = { version = "1.18.1", features = ["v4"] }
tracing.workspace = true
device_query = "4.0.1"
image = { version = "0.25.2", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
either = "1.13.0"
tracing-subscriber = { version = "0.3.19" }
relative-path = "2.0.3"
tokio-util = "0.7.15"
blake3 = "1.8.2"
sha2 = "0.11.1"
hex = "0.4.3"
ringbuf = "0.5.3"
cpal.workspace = true
indexmap = "2.10.0"
kameo = "0.22.2"
inquire = "0.9.4"
replace_with = "0.1.8"
retry = "2.1.0"
sysinfo = "0.39"
parking_lot = "0.13"
dhat = { version = "0.3", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance",
    "Win32_Storage_Xps",
    "Win32_Storage_FileSystem",
] }

cap-d3d-adapter = { path = "../d3d-adapter" }
cap-enc-mediafoundation = { path = "../enc-mediafoundation" }
cap-mediafoundation-ffmpeg = { path = "../mediafoundation-ffmpeg" }
cap-mediafoundation-utils = { path = "../mediafoundation-utils" }
cap-camera-windows = { path = "../camera-windows" }
scap-direct3d = { path = "../scap-direct3d" }
scap-cpal = { path = "../scap-cpal" }

[dev-dependencies]
tempfile = "3.20.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
windows = { workspace = true, features = ["Win32_UI_HiDpi"] }

[[test]]
name = "synthetic_recording"
required-features = ["test-utils"]

[[example]]
name = "synthetic-test-runner"
required-features = ["test-utils"]

[[example]]
name = "playback-test-runner"

[[example]]
name = "real-device-test-runner"

[[example]]
name = "memory-stress-test"

[[example]]
name = "instant-mode-profile"
