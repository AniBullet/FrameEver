[package]
name = "frameever-verify"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
frameever-media-info = { path = "../media-info" }
frameever-project = { path = "../project" }
frameever-recording = { path = "../recording" }
frameever-timestamp = { path = "../timestamp" }

anyhow = { workspace = true }
ffmpeg = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
relative-path = "2.0.3"
rustfft = "6.4.1"
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
frameever-verify-expect = { path = "../verify-expect" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
frameever-enc-avfoundation = { path = "../enc-avfoundation" }
cidre = { workspace = true }

[dev-dependencies]
frameever-recording = { path = "../recording", features = ["test-utils"] }
frameever-editor = { path = "../editor", features = ["test-hooks"] }
frameever-audio = { path = "../audio" }
frameever-export = { path = "../export" }
frameever-rendering = { path = "../rendering" }
cpal = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
frameever-camera-ffmpeg = { path = "../camera-ffmpeg" }
scap-targets = { path = "../scap-targets" }

[target.'cfg(windows)'.dev-dependencies]
scap-targets = { path = "../scap-targets" }
frameever-camera-windows = { path = "../camera-windows" }
frameever-mediafoundation-utils = { path = "../mediafoundation-utils" }
windows = { workspace = true, features = ["Win32_Media_MediaFoundation"] }
