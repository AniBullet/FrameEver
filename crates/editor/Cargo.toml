[package]
name = "frameever-editor"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[example]]
name = "decode-benchmark"
path = "examples/decode-benchmark.rs"

[[example]]
name = "playback-pipeline-benchmark"
path = "examples/playback-pipeline-benchmark.rs"

[[example]]
name = "editor-playback-benchmark"
path = "examples/editor-playback-benchmark.rs"

[[example]]
name = "audio-output-idle-benchmark"
path = "examples/audio-output-idle-benchmark.rs"

[[example]]
name = "editor-startup-benchmark"
path = "examples/editor-startup-benchmark.rs"

[features]
# Offline audio output for the frameever-verify suite. Never enabled by the app.
test-hooks = []

[dependencies]
frameever-utils = { path = "../utils" }
frameever-media = { path = "../media" }
frameever-project = { path = "../project" }
frameever-rendering = { path = "../rendering" }
frameever-audio = { path = "../audio" }
frameever-media-info = { path = "../media-info" }

tokio = { workspace = true, features = ["macros", "process", "fs"] }
cpal.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
ffmpeg.workspace = true
specta.workspace = true
serde = { workspace = true }
serde_json = "1.0"
image = { version = "0.25.2", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
tempfile = "3"
futures = { workspace = true }
tracing.workspace = true
flume.workspace = true
tokio-util = "0.7.15"
ringbuf = "0.5.3"
lru = "0.19"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Media"] }

[dev-dependencies]
frameever-audio = { path = "../audio", features = ["test-support"] }
frameever-enc-ffmpeg = { path = "../enc-ffmpeg" }
