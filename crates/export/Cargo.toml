[package]
name = "frameever-export"
version = "0.1.0"
edition = "2024"

[dependencies]
frameever-utils = { path = "../utils" }
frameever-project = { path = "../project" }
frameever-rendering = { path = "../rendering" }
frameever-editor = { path = "../editor" }
frameever-media = { path = "../media" }
frameever-flags = { path = "../flags" }
frameever-enc-ffmpeg = { path = "../enc-ffmpeg" }
frameever-enc-gif = { path = "../enc-gif" }
frameever-media-info = { path = "../media-info" }

tokio.workspace = true
tempfile = "3.12.0"
image = { version = "0.25.2", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
base64 = "0.23.1"
mp4 = "0.14.0"
thiserror.workspace = true
futures = { workspace = true }
ffmpeg = { workspace = true }
serde = { workspace = true }
specta.workspace = true
serde_json = "1.0.140"
tracing.workspace = true
gifski = "1.32"
imgref = "1.10"
rgb = "0.8"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
clap = { version = "4.5.41", features = ["derive"] }
chrono = "0.4"
directories = "6.0.0"
inquire = "0.9.4"
tokio.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[lints]
workspace = true
